name: CI

on:
  push:
    branches: [ master, main, develop ]

jobs:
  check-commit:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.filter.outputs.should-run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check conventional commit
        id: filter
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          if echo "$COMMIT_MSG" | grep -E "^(feat|fix)(\(.+\))?:"; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "✅ Conventional commit detected (feat/fix)"
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
            echo "⏭️  Skipping CI - not a feat/fix commit"
          fi

  build:
    needs: check-commit
    if: needs.check-commit.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.x'
      
      - name: Install dependencies
        run: |
          install.packages(c("devtools", "remotes", "rmarkdown", "knitr"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
      
      - name: Check R package
        run: |
          devtools::check()
        shell: Rscript {0}
      
      - name: Run tests
        run: |
          devtools::test()
        shell: Rscript {0}
