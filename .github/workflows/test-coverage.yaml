name: test-coverage

on:
  push:
    branches: [main, master]
    paths:
      - 'R/**'
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/test-coverage.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - 'R/**'
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/test-coverage.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          # release (not devel): binary packages from RSPM, stable timings
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::DT
            any::htmltools
          needs: coverage
          cache: true
          cache-version: 2

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(type = "tests")
          print(cov)
          if (requireNamespace("DT", quietly = TRUE) && requireNamespace("htmltools", quietly = TRUE)) {
            covr::report(cov, file = "coverage.html")
          } else {
            message("DT/htmltools not available, skipping HTML report generation.")
            writeLines("Coverage report skipped: DT/htmltools missing.", "coverage.html")
          }
        shell: Rscript {0}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html
