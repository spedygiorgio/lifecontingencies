name: test-coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::DT
            any::htmltools
          needs: coverage
          cache: true
          cache-version: 2

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(type = "tests")
          print(cov)
          if (requireNamespace("DT", quietly = TRUE) && requireNamespace("htmltools", quietly = TRUE)) {
            covr::report(cov, file = "coverage.html")
          } else {
            message("DT/htmltools not available, skipping HTML report generation.")
            writeLines("Coverage report skipped: DT/htmltools missing.", "coverage.html")
          }
        shell: Rscript {0}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html
