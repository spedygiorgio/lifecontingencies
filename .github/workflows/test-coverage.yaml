name: test-coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::DT
            any::htmltools
          needs: coverage
          cache: true
          cache-version: 2

      - name: Diagnose benchmark values
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source", quiet = TRUE)
          library(lifecontingencies)
          data(demoIta)
          sim02 <- demoIta$SIM02
          sim02 <- sim02[!is.na(sim02) & sim02 != 0]
          tab <- new("actuarialtable", x = seq(0, length(sim02) - 1), lx = sim02, interest = 0.04)
          out <- c(
            paste("Ex4", round(30000 * Exn(tab, x = 30, n = 20), 2)),
            paste("Ex5", round(16000 * Exn(tab, x = 35, n = 30), 2)),
            paste("Ex6", round(26000 / Exn(tab, x = 40, n = 22), 2)),
            paste("Ex9", round(15000 / Exn(tab, x = 32, n = 20), 2)),
            paste("Ex12", round(15000 / Exn(tab, x = 50, n = 20), 2)),
            paste("Ex11", round(20000 * Exn(tab, x = 27, n = 23) + 35000 * Exn(tab, x = 27, n = 33), 2)),
            paste("Ex13_due", round(20000 * axn(tab, x = 46), 2)),
            paste("Ex13_immediate", round(20000 * axn(tab, x = 46, payment = "immediate"), 2)),
            paste("Ex14", round(12000 * axn(tab, x = 36, m = 24), 2)),
            paste("Ex15_immediate", round(12000 * axn(tab, x = 36, n = 25, payment = "immediate"), 2)),
            paste("Ex15_deferred", round(12000 * axn(tab, x = 36, n = 20, m = 12), 2)),
            paste("Ex16_immediate", round(22000 * axn(tab, x = 46, n = 25, payment = "immediate"), 2)),
            paste("Ex16_deferred", round(22000 * axn(tab, x = 46, n = 20, m = 2), 2)),
            paste("Ex17_whole", round(100000 * Axn(tab, x = 28), 2)),
            paste("Ex17_temp", round(100000 * Axn(tab, x = 28, n = 37), 2)),
            paste("Ex17_deferred", round(100000 * Axn(tab, x = 28, n = 37, m = 37), 2))
          )
          writeLines(out, "benchmark-values.txt")
          writeLines(capture.output(sessionInfo()), "session-info.txt")

      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-diagnostics
          path: |
            benchmark-values.txt
            session-info.txt
          if-no-files-found: error

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(type = "tests")
          print(cov)
          if (requireNamespace("DT", quietly = TRUE) && requireNamespace("htmltools", quietly = TRUE)) {
            covr::report(cov, file = "coverage.html")
          } else {
            message("DT/htmltools not available, skipping HTML report generation.")
            writeLines("Coverage report skipped: DT/htmltools missing.", "coverage.html")
          }
        shell: Rscript {0}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html
