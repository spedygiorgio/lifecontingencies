# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Site articles are the HTML vignettes (Rmd/qmd); pkgdown does not render the
# Sweave (.Rnw) vignettes, so no LaTeX is installed here (it used to take
# ~6 of the ~8 minutes of this job). PRs build the site without deploying it
# and superseded PR runs are cancelled.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'tests/**'
      - 'data-raw/**'
      - 'trash_and_old/**'
      - 'inst/benchmarks/**'
      - 'cran-comments.md'
      - '.github/workflows/R-CMD-check.yaml'
      - '.github/workflows/test-coverage.yaml'
      - '.github/workflows/release.yaml'
      - '.github/workflows/benchmark-rcpp.yml'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'tests/**'
      - 'data-raw/**'
      - 'trash_and_old/**'
      - 'inst/benchmarks/**'
      - 'cran-comments.md'
      - '.github/workflows/R-CMD-check.yaml'
      - '.github/workflows/test-coverage.yaml'
      - '.github/workflows/release.yaml'
      - '.github/workflows/benchmark-rcpp.yml'
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pkgdown-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NO_COLOR: "1"
      R_CLI_NUM_COLORS: "1"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - id: pandoc
        uses: r-lib/actions/setup-pandoc@v2
        continue-on-error: true
        with:
          pandoc-version: '3.1.11'

      - if: steps.pandoc.outcome == 'failure'
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.1.11'

      - id: quarto
        uses: quarto-dev/quarto-actions/setup@v2
        continue-on-error: true
        with:
          version: '1.10.18'

      - if: steps.quarto.outcome == 'failure'
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::knitr
            any::rmarkdown
            local::.
          needs: website
          cache: true

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
