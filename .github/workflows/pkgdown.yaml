name: pkgdown

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
  cancel-in-progress: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NO_COLOR: "1"
      R_CLI_NUM_COLORS: "1"

    steps:
      - uses: actions/checkout@v5

      - id: pandoc
        uses: r-lib/actions/setup-pandoc@v2
        continue-on-error: true
        with:
          pandoc-version: '3.1.11'

      - if: steps.pandoc.outcome == 'failure'
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.1.11'

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::tinytex, local::.
          needs: website
          cache: true

      - name: Install TinyTeX
        run: |
          for i in 1 2 3; do
            Rscript -e 'tinytex::install_tinytex()' && exit 0
            echo "TinyTeX install attempt $i failed, retrying..."
            sleep 20
          done
          exit 1
        shell: bash

      - name: Install LaTeX extras
        shell: Rscript {0}
        run: |
          pkgs <- c(
            "ae","inconsolata","upquote","courier","fancyvrb","framed","titling","booktabs",
            "geometry","hyperref","url","xcolor","microtype","graphicx","graphics",
            "grfext","thumbpdf","float","caption","subcaption","babel-english",
            "amsmath","amssymb","mathtools","siunitx","etoolbox","natbib","biblatex",
            "csquotes","ulem","parskip","titlesec","wrapfig","longtable",
            "makecell","multirow","colortbl","pgf","tikz","xkeyval","changepage"
          )
          tinytex::tlmgr_install(pkgs, .quiet = TRUE)

      - name: Ensure PDF tools (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y ghostscript qpdf

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
