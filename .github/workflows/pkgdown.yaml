name: pkgdown

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
      _R_CHECK_LIMIT_CORES_: true
      R_CHECK_NUM_CORES: 1

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::knitr
            any::rmarkdown
            any::tinytex
            local::.
          needs: website

      - name: Cache TinyTeX
        id: tinytex-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.TinyTeX
            ~/Library/TinyTeX
            ~/AppData/Roaming/TinyTeX
          key: tinytex-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/tinytex-packages.txt') }}

      - name: Setup TinyTeX
        if: steps.tinytex-cache.outputs.cache-hit != 'true'
        uses: r-lib/actions/setup-tinytex@v2

      - name: Restore cached TinyTeX to PATH
        if: steps.tinytex-cache.outputs.cache-hit == 'true'
        shell: Rscript {0}
        run: |
          root <- path.expand("~/.TinyTeX")
          if (!dir.exists(root)) stop("Cached TinyTeX directory not found: ", root)
          tinytex::use_tinytex(from = root)
          cat("TinyTeX root: ", root, "\n", sep = "")
          cat("tlmgr: ", Sys.which("tlmgr"), "\n", sep = "")

      - name: Install LaTeX packages (TinyTeX)
        shell: Rscript {0}
        run: |
          pkgs <- trimws(readLines(".github/tinytex-packages.txt"))
          pkgs <- pkgs[nzchar(pkgs) & !startsWith(pkgs, "#")]
          if (!tinytex::is_tinytex()) stop("TinyTeX is not available")
          tinytex::tlmgr_install(pkgs, .quiet = FALSE)
          cat("Installed/verified ", length(pkgs), " LaTeX packages.\n", sep = "")

      - name: Ensure PDF tools (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y ghostscript qpdf

      - name: Diagnose TeX installation
        shell: Rscript {0}
        run: |
          cat("R: ", R.version.string, "\n", sep = "")
          cat("Pandoc: ", Sys.which("pandoc"), "\n", sep = "")
          cat("pdflatex: ", Sys.which("pdflatex"), "\n", sep = "")
          cat("xelatex: ", Sys.which("xelatex"), "\n", sep = "")
          cat("tlmgr: ", Sys.which("tlmgr"), "\n", sep = "")
          print(tinytex::tinytex_root())
          tinytex::tlmgr_update()

      - name: Build vignettes (PDF) and stage for pkgdown
        shell: Rscript {0}
        run: |
          dir.create("inst/doc", recursive = TRUE, showWarnings = FALSE)
          tools::buildVignettes(dir = ".", tangle = FALSE, clean = FALSE)

          if (dir.exists("inst/doc")) {
            pdfs <- list.files("inst/doc", pattern = "\\.pdf$", full.names = TRUE)
            if (length(pdfs) == 0L) stop("Vignette build produced no PDF files")
            tools::compactPDF("inst/doc", qpdf = "qpdf")
            dir.create("docs/articles", recursive = TRUE, showWarnings = FALSE)
            ok <- file.copy(pdfs, file.path("docs/articles", basename(pdfs)), overwrite = TRUE)
            if (!all(ok)) stop("Failed to copy one or more vignette PDFs to docs/articles")
          }

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
