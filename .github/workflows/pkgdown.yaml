# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NO_COLOR: "1"
      R_CLI_NUM_COLORS: "1"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - id: pandoc
        uses: r-lib/actions/setup-pandoc@v2
        continue-on-error: true
        with:
          pandoc-version: '3.1.11'

      - if: steps.pandoc.outcome == 'failure'
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.1.11'

      - id: quarto
        uses: quarto-dev/quarto-actions/setup@v2
        continue-on-error: true
        with:
          version: '1.10.18'

      - if: steps.quarto.outcome == 'failure'
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::knitr
            any::rmarkdown
            any::tinytex
            local::.
          needs: website
          cache: true

      - id: tinytex
        uses: r-lib/actions/setup-tinytex@v2
        continue-on-error: true

      - if: steps.tinytex.outcome == 'failure'
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install LaTeX packages
        shell: Rscript {0}
        run: |
          pkgs <- trimws(readLines('.github/tinytex-packages.txt'))
          pkgs <- pkgs[nzchar(pkgs) & !startsWith(pkgs, '#')]
          tinytex::tlmgr_install(pkgs, .quiet = TRUE)

      - name: Ensure PDF tools
        run: sudo apt-get update && sudo apt-get install -y ghostscript qpdf

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
