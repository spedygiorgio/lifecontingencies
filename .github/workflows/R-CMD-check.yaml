name: R-CMD-check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest,  r: 'devel' }
          - { os: macos-latest,   r: 'devel' }
          - { os: windows-latest, r: 'devel' }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
      # Evita problemi con parallel durante i check
      _R_CHECK_LIMIT_CORES_: true
      R_CHECK_NUM_CORES: 1

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # ---------- System deps before R package install ----------
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf ghostscript

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qpdf ghostscript gettext
          GETTEXT_PREFIX="$(brew --prefix gettext)"
          echo "CPPFLAGS=-I${GETTEXT_PREFIX}/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L${GETTEXT_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${GETTEXT_PREFIX}/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "Homebrew prefix: $(brew --prefix)"
          echo "gettext prefix: ${GETTEXT_PREFIX}"
          test -f "${GETTEXT_PREFIX}/include/libintl.h"

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y ghostscript
          choco install -y qpdf

      # ---------- Dipendenze R ----------
      # setup-r-dependencies already caches the R package library.
      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::knitr
            any::rmarkdown
            any::tinytex
          needs: check
          cache-version: 3

      # ---------- TinyTeX cache ----------
      # TinyTeX is platform-specific, so include OS/architecture in the key.
      # The package list is also part of the key: changing it creates a fresh cache.
      - name: Cache TinyTeX
        id: tinytex-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.TinyTeX
            ~/Library/TinyTeX
            ~/AppData/Roaming/TinyTeX
          key: tinytex-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/tinytex-packages.txt') }}

      - name: Setup TinyTeX
        if: steps.tinytex-cache.outputs.cache-hit != 'true'
        uses: r-lib/actions/setup-tinytex@v2

      - name: Restore cached TinyTeX to PATH
        if: steps.tinytex-cache.outputs.cache-hit == 'true'
        shell: Rscript {0}
        run: |
          os <- Sys.info()[["sysname"]]
          root <- switch(
            os,
            Linux = path.expand("~/.TinyTeX"),
            Darwin = path.expand("~/Library/TinyTeX"),
            Windows = file.path(Sys.getenv("APPDATA"), "TinyTeX")
          )
          if (!dir.exists(root)) stop("Cached TinyTeX directory not found: ", root)
          tinytex::use_tinytex(from = root)
          cat("TinyTeX root:", root, "\n")
          cat("tlmgr:", Sys.which("tlmgr"), "\n")

      # Install the exact LaTeX dependencies used by the package.
      # On a cache hit tlmgr_install is effectively a no-op for already installed packages.
      - name: Install LaTeX packages (TinyTeX)
        shell: Rscript {0}
        run: |
          pkgs <- trimws(readLines(".github/tinytex-packages.txt"))
          pkgs <- pkgs[nzchar(pkgs)]
          if (!tinytex::is_tinytex()) stop("TinyTeX is not available")
          tinytex::tlmgr_install(pkgs, .quiet = TRUE)
          cat("Installed/verified", length(pkgs), "LaTeX packages.\n")

      # Save the freshly provisioned TinyTeX before R CMD check so a failing check
      # does not force the next run to reinstall the entire TeX distribution.
      - name: Save TinyTeX cache
        if: steps.tinytex-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.TinyTeX
            ~/Library/TinyTeX
            ~/AppData/Roaming/TinyTeX
          key: tinytex-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/tinytex-packages.txt') }}

      # ---------- CHECK con build vignette solo su Linux ----------
      - name: Check (build vignettes)
        if: runner.os == 'Linux'
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-resave-data","--compact-vignettes=both")'
          args: 'c("--as-cran")'
          error-on: '"error"'

      # ---------- CHECK senza vignette su macOS ----------
      # macOS still runs the full package check, but avoids the expensive vignette build.
      - name: Check (no vignettes on macOS)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-resave-data","--no-build-vignettes","--compact-vignettes=both")'
          args: 'c("--as-cran")'
          error-on: '"error"'

      # ---------- CHECK senza vignette su Windows ----------
      - name: Check (no vignettes on Windows)
        if: runner.os == 'Windows'
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-resave-data","--no-build-vignettes")'
          args: 'c("--as-cran")'
          error-on: '"error"'
